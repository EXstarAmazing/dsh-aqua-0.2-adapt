# 注意：原插件条目 registry/skins/WYH66666666__DSH-Transparent-UI-Plugin.yml 已存在，
# 声明 compatibility.dsh: ^0.1.0-rc.5 且 install.desktop.mode: manual-only。
# 本条目是**独立的新条目**（不同 repo / package 来源），面向 0.2.x 运行时；
