id: exstaramazing.dsh-aqua-0.2-adapt
name:
  zh: Aqua 玻璃主题（DSH 0.2 适配版）
  en: Aqua Glass Theme (DSH 0.2 adapt)
author: EXstarAmazing
description: >-
  上游 WYH66666666/DSH-Transparent-UI-Plugin（Aqua 磨砂玻璃主题）的 DSH 0.2 兼容适配分支。
  修复了上游 1.3.1 在 0.2.0-rc.2 上会直接导致 web 启动失败的问题（require 了 DSH 根本不存在的
  @deepseek-ai/dsh-client-runtime），并适配了图标改名、总开关插槽迁移、store 句柄/注入面契约变化，
  以及 0.2 布局新增的不透明底导致背景只在侧边栏可见的问题。主题外观与功能逻辑保持上游原样。
repo: https://github.com/EXstarAmazing/dsh-aqua-0.2-adapt
package: dsh-client-ui-aqua
rowId: ui-aqua
category: theme
tags:
  - wallpaper
  - glass
  - motion
  - token-theme
  - light-dark
modes:
  - light
  - dark
install:
  target: github:EXstarAmazing/dsh-aqua-0.2-adapt#ed8e543207f281f7a4e99170f8f9f8de0847fc66
  version: 1.3.2
  commit: ed8e543207f281f7a4e99170f8f9f8de0847fc66
  desktop:
    mode: manual-only
    reason: npm-package-not-found
compatibility:
  dsh: ">=0.2.0-rc.2 <0.3.0-0"
  platform:
    - web
screenshots:
  - https://raw.githubusercontent.com/EXstarAmazing/dsh-aqua-0.2-adapt/main/assets/1.png
  - https://raw.githubusercontent.com/EXstarAmazing/dsh-aqua-0.2-adapt/main/assets/2.png
  - https://raw.githubusercontent.com/EXstarAmazing/dsh-aqua-0.2-adapt/main/assets/3.png
  - https://raw.githubusercontent.com/EXstarAmazing/dsh-aqua-0.2-adapt/main/assets/4.png
